<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magazzino kit</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kit Lab">
<meta name="theme-color" content="#0e6b5b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f0;--ink:#13231f;--mut:#5a6b66;--line:#cbd6d2;--surf:#fff;--acc:#0e6b5b;--onacc:#fff;--warn:#9a5b00;--warnbg:#fff1d6;--bad:#a8231b;--badbg:#fde4e1;--info:#1d4f91;--infobg:#e1ecfb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1816;--ink:#e6efec;--mut:#9bb0aa;--line:#2b3d38;--surf:#17231f;--acc:#4cc2ab;--onacc:#06201a;--warn:#f2c46b;--warnbg:#3a2c0e;--bad:#ff9d94;--badbg:#401a17;--info:#9cc3f5;--infobg:#142a47}}
:root[data-theme="dark"]{--bg:#0f1816;--ink:#e6efec;--mut:#9bb0aa;--line:#2b3d38;--surf:#17231f;--acc:#4cc2ab;--onacc:#06201a;--warn:#f2c46b;--warnbg:#3a2c0e;--bad:#ff9d94;--badbg:#401a17;--info:#9cc3f5;--infobg:#142a47}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Public Sans",system-ui,sans-serif;padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px));max-width:640px;margin-inline:auto}
h1{font-size:1.5rem;font-weight:800;margin:8px 0 2px}
h2{font-size:1.05rem;margin:22px 0 8px}
.sub{color:var(--mut);margin:0 0 12px;font-size:.9rem}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surf);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:10px 2px;border-radius:10px;font-size:.72rem}
nav button[aria-current=true]{color:var(--acc);background:var(--bg)}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.row{background:var(--surf);border-left:6px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 8px}
.row.bad{border-color:var(--bad);background:var(--badbg)}.row.warn{border-color:var(--warn);background:var(--warnbg)}.row.info{border-color:var(--info);background:var(--infobg)}
.row b{display:block}.row small{color:var(--mut)}
.empty{color:var(--mut);padding:8px 0}
.prod{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px}
.prod header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tot{font-weight:800}.tot.low{color:var(--bad)}
.lot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:.95rem}
.lot span{flex:1}.lot .x{color:var(--bad);font-weight:600}
.lot button{width:40px;height:40px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font-size:1.2rem}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.9rem}
input[type=text],input[type=date],input[type=number],input[type=month]{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cta{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:var(--onacc);font:inherit;font-weight:800;margin-top:18px}
.scan{display:block;text-align:center;padding:18px;border:2px dashed var(--acc);border-radius:12px;color:var(--acc);font-weight:800;cursor:pointer;margin:0}
.scan{position:relative;overflow:hidden}
.scan input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:100px;cursor:pointer}
select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink);font:inherit}
.ed{padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font:inherit;margin-top:8px}.ed.bad{color:var(--bad);border-color:var(--bad)}.prod .cta{margin-top:12px}
.help{float:right;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--acc);font:inherit;font-weight:800;font-size:1.1rem;margin-top:6px}
.tip{background:var(--infobg);color:var(--ink);border-left:6px solid var(--info);border-radius:6px;padding:10px 12px;margin:0 0 12px;font-size:.92rem}
details{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px}summary{font-weight:700;cursor:pointer}details ul{margin:8px 0 0;padding-left:20px;font-size:.93rem}details li{margin:5px 0}
.lot .first{color:var(--acc);font-weight:800}
#st{min-height:1.4em;margin:8px 0 0;font-size:.9rem;color:var(--mut)}
/* fotocamera dal vivo */
#lw{margin-top:10px}
#qr-box{position:relative;border-radius:12px;overflow:hidden;background:#000;min-height:180px}
#qr-reader{width:100%;border:0!important;padding:0!important}
#qr-reader video{width:100%!important;display:block;margin:0!important;border-radius:0}
#qr-reader img[alt="Info icon"]{display:none}
.aim{position:absolute;left:3%;right:3%;top:50%;height:0;border-top:2px solid #ff2d20;box-shadow:0 0 8px 1px #ff2d20;pointer-events:none;animation:aim 1.1s ease-in-out infinite alternate}
@keyframes aim{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.aim{animation:none}}
.tbox{position:absolute;left:4%;width:92%;top:35%;height:30%;border:2px solid #ff2d20;border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.okf{border-color:var(--acc)!important;box-shadow:0 0 0 3px var(--acc)}
.lvb{display:flex;gap:8px;flex-wrap:wrap}
.lvb .ed:disabled{opacity:.6}
.gflash{animation:gf 1s ease-out}
@keyframes gf{0%{background:#2fb383}100%{background:var(--bg)}}
@media (prefers-reduced-motion:reduce){.gflash{animation:none}}	
.fun{display:flex;gap:12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px;color:var(--ink)}
.fun p{margin:0}.fun small{color:var(--mut)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--onacc);font-weight:800;padding:10px 18px;border-radius:999px;z-index:50}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat div{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:.85rem;color:var(--mut)}.stat b{display:block;font-size:1.4rem;color:var(--ink)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;padding:6px 2px}
.ni{font-style:normal;font-size:1.2rem;line-height:1}nav.serio .ni{display:none}
.bdg{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;font-style:normal}.bdg[hidden]{display:none}
.sem{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;margin:2px 0 4px;color:var(--ink)}
.sem i{width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--mut)}.sem.g i{background:#2f9e6b}.sem.y i{background:#d9a200}.sem.r i{background:var(--bad)}
.swc{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);padding:0}.swc[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}.swn[aria-pressed=true]{border-color:var(--ink)}

#t{color:#075f91!important;text-shadow:0 2px 0 #fff;font-size:1.7rem;letter-spacing:-.035em}
#t::before{content:"🧬 ";font-size:.9em}
.sub{color:#5d7f95!important}
nav{background:rgba(255,255,255,.96)!important;border-top:2px solid #b9e3f7!important;box-shadow:0 -6px 22px rgba(20,111,158,.10)}
nav button[aria-current=true]{background:#dff3ff!important;color:#087eae!important}
button,.cta,.ed,select,input[type=text],input[type=date],input[type=number],input[type=month]{border-radius:15px!important}
.cta{background:linear-gradient(110deg,#0797c9,#086b9f)!important;color:#fff!important;box-shadow:0 5px 14px rgba(0,112,164,.18)}
.prod,.fun,.tip,details,.row,.stat div{border-radius:18px!important;border:1px solid #c7e5f4!important;box-shadow:0 4px 14px rgba(35,123,164,.07)}
.fun{background:linear-gradient(110deg,#fff,#effaff)!important}
.row{border-left-width:5px!important}
input,select{background:#fff!important;color:#153b59!important;border-color:#c5e2f1!important}
.help{background:#fff!important;color:#087eae!important;border-radius:14px!important;box-shadow:0 3px 12px rgba(20,111,158,.12)}
.lot button{background:#eaf7ff!important;border-radius:50%!important;border-color:#b9deef!important}
.scan{background:#f0faff!important;border-color:#168fc1!important}
#qr-box{border:3px solid #b9e3f7}
/* decorazioni non interattive: non intercettano mai i tocchi */
#v{position:relative}
#v::after{content:"🧪   🧬   🔬";display:block;text-align:center;letter-spacing:.55em;font-size:1.05rem;opacity:.48;padding:10px 0 2px;pointer-events:none}
@media (max-width:420px){body::before{background-size:auto 100%;opacity:.30}#t{font-size:1.55rem}}
@media (prefers-reduced-motion:no-preference){.cta{transition:filter .18s ease,transform .18s ease}.cta:active{filter:brightness(.96);transform:translateY(1px)}}

etto: scegli il prodotto dall’elenco e premi “Registra in Bolla” o “Salva kit”, e dalla volta dopo il kit è riconosciuto da solo.</li><li><b>Nome del kit</b>: la prima volta lo scrivi o scegli un suggerimento; “Fotografa il nome” legge solo la scritta. Poi l’app lo ricorda.</li><li><b>Soglia minima</b>: sotto questa quantità arriva l’avviso di scorta.</li><li><b>Controllo date</b>: se la scadenza è già passata o oltre 7 anni, l’app chiede conferma prima di salvare.</li><li><b>Richiede calibrazione</b>: attivala per i kit da calibrare al cambio lotto.</li>'],
['scarico','Scarico','<li>Scansiona il kit che stai per <b>aprire</b>, non quello finito.</li><li>L’app ti avvisa se non è il lotto che scade prima, o se è scaduto.</li><li>Se il lotto in uso cambia, compare l’avviso e, se prevista, la calibrazione da registrare.</li><li>Dalla scheda Avvisi il pulsante <b>Scarica un kit</b> arriva qui con la fotocamera già accesa.</li><li>Se in Riepilogo hai scritto l’operatore, il suo nome resta registrato nello scarico.</li><li>Errore? Usa <b>Annulla ultimo scarico</b>.</li><li>Per i kit senza codice (o senza lotto nel codice) usa il tasto − nella scheda Scorte, sul lotto che apri: conta come scarico, con data e operatore, ed entra nei consumi e nel riordino. Il + premuto lo stesso giorno annulla quello scarico.</li><li>Per correggere una quantità sbagliata senza contarla come consumo usa “Modifica prodotto e lotti”.</li>'],
['scorte','Scorte e modifiche','<li><b>Cerca un kit</b>: scrivi nome, codice articolo, GTIN o lotto per vedere subito giacenza, lotti e scadenze.</li><li><b>Semaforo</b>: verde Ok, giallo In scadenza o Scorta bassa, rosso Scaduto, grigio Esaurito. La fascia colorata a sinistra indica il reparto (si sceglie in Riepilogo).</li><li><b>Quantità per lotto</b> e “usa per primo”: il lotto che scade prima.</li><li><b>Consumo medio e durata stimata</b>: l’app conta i kit scaricati negli ultimi 90 giorni e calcola quanti ne usi al mese e per quanto basta la scorta. Servono almeno 3 scarichi dello stesso prodotto: prima la riga non compare.</li><li><b>Soglia minima</b>: impostala per ogni prodotto in “Modifica prodotto e lotti”. Sotto quella quantità arriva l’avviso e il prodotto entra nella lista di riordino. Senza soglia e senza consumo stimato il prodotto non viene mai segnalato.</li><li><b>Modifica prodotto e lotti</b>: cambia nome, soglia, lotto, scadenza e quantità, oppure elimina.</li><li><b>Calibrazione</b>: registri quella del nuovo lotto o una nuova sullo stesso lotto, e vedi l’ultima.</li><li><b>Codice articolo</b>: la casella sotto il nome del prodotto.</li>'],
['bolle','Archivio bolle','<li><b>Registra una bolla</b>: numero, data, reparto, fornitore o corriere e kit in arrivo.</li><li>I kit si aggiungono con <b>Scansiona un kit</b> (compila codice, lotto e scadenza) o a mano con <b>Aggiungi riga a mano</b>.</li><li>Spunta <b>Carica questi kit anche nelle Scorte</b> per caricarli subito a magazzino nel reparto scelto (solo le righe con lotto e scadenza).</li><li><b>Archivio storico consegne</b>: tabella dei kit registrati con “Registra in Bolla”, filtrabile per reparto.</li><li><b>Storico</b>: filtra per reparto; tocca una bolla per vedere i kit.</li><li><b>Gestisci reparti</b>: aggiungi o rimuovi reparti. L’elenco è lo stesso dei settori. Un reparto con kit in magazzino non si può rimuovere.</li><li>Eliminare una bolla non toglie i kit dalle Scorte.</li><li>In una bolla puoi indicare l’<b>ordine collegato</b>: l’app aggiorna le quantità arrivate (vedi “Registro ordini”).</li>'],
['avvisi','Avvisi e riordino','<li><b>Scarica un kit</b>: il pulsante grande in alto apre subito la fotocamera per lo scarico.</li><li><b>Badge sulla scheda Avvisi</b>: il numero rosso conta gli avvisi gravi (scaduti); se non ce ne sono, il numero arancione conta quelli da controllare.</li><li>Gli avvisi sono: scaduti, in scadenza (60 giorni), scorta sotto soglia o in esaurimento, nuovo lotto in arrivo, cambio lotto in uso, calibrazione da registrare, backup.</li><li><b>Cerca un kit</b>: scrivi nome, codice, GTIN o lotto e vedi giacenza, lotti e scadenze.</li><li><b>Lista di riordino</b>: contiene i prodotti sotto la soglia minima e quelli che, in base al consumo, durano 14 giorni o meno.</li><li><b>Come si calcola la quantità</b>: consumo mensile moltiplicato per i mesi di scorta che vuoi coprire (di base 2), meno quanto hai già in magazzino. Se il consumo non è ancora stimabile si usa la soglia minima. Sono suggerimenti: puoi modificarli.</li><li>Puoi scaricare il <b>PDF ordine</b>, copiare il testo o inviarlo su WhatsApp. Se scrivi il fornitore, compare nel testo.</li><li><b>Segna come ordinato</b> salva l’ordine nel Registro ordini (scheda Bolle): finché è aperto, quei kit non vengono riproposti nella lista.</li><li>Perché la lista funzioni registra ogni apertura con <b>Scarico</b> e imposta la soglia minima di ogni prodotto in Scorte.</li>'],
['riepilogo','Riepilogo e backup','<li>Scegli il mese e scarica il <b>PDF dei kit scaricati</b>.</li><li><b>Statistiche del mese</b>: kit scaricati, pezzi in magazzino, lotti in scadenza e scaduti.</li><li><b>Operatore</b>: scrivi nome o iniziali. Viene registrato negli scarichi e nelle non conformità fatti da quel momento.</li><li><b>Non conformità</b>: scegli kit e lotto, il motivo e una nota. Con la spunta il lotto esce dalle scorte.</li><li><b>CSV</b>: “Scorte e scadenze” e “Registro operazioni” (scarichi e non conformità) si aprono da Excel.</li><li><b>Parte simpatica</b>: la Modalità seria spegne messaggi, emoji, mascotte e vibrazione. Il nome serve per il saluto.</li><li><b>Aspetto</b>: scegli il colore principale, il tema (automatico, chiaro o scuro) e la dimensione del testo. “Ripristina aspetto” torna alle impostazioni iniziali.</li><li><b>Colori dei reparti</b>: un colore per ogni reparto: fascia sulle schede di Scorte e riordino, pallino accanto al nome del reparto in Avvisi, Bolle, Ordini e archivio consegne. Non cambia il colore principale dell’app.</li><li><b>Backup</b>: salva tutti i dati (anche le bolle) in un file. <b>Ripristina</b> sostituisce i dati attuali.</li><li>Fai un backup prima di cambiare telefono, rimuovere l’icona o cancellare i dati di Safari.</li>'],
['qualita','Qualità e tracciabilità','<li><b>Lotto e scadenza</b> sono registrati a ogni carico, e i cambi di lotto compaiono negli avvisi.</li><li><b>Primo a scadere, primo a uscire</b>: allo scarico l’app ti avvisa se esiste un lotto che scade prima.</li><li><b>Controllo date</b>: al salvataggio chiede conferma se la scadenza è già passata o oltre 7 anni, perché potrebbe essere letta male.</li><li><b>Non conformità</b> e <b>operatore</b> si gestiscono in Riepilogo.</li><li>Il CSV <b>Registro operazioni</b> raccoglie scarichi e non conformità con data, lotto e operatore.</li><li>L’app aiuta a tenere traccia, ma non sostituisce il sistema qualità del laboratorio.</li>'],
['simpatica','Parte simpatica e Modalità seria','<li>La provetta mascotte compare in Avvisi e diventa rossa se c’è qualcosa di scaduto.</li><li>Saluto per l’ora (con il tuo nome se lo scrivi), frase del giorno e messaggio “Tutto sotto controllo” quando non ci sono avvisi.</li><li>“Preso!” con vibrazione dopo un riconoscimento o uno scarico (la vibrazione funziona solo su Android).</li><li><b>Modalità seria</b> (in Riepilogo): spegne messaggi, emoji, mascotte e vibrazione. Il semaforo e i colori dei reparti restano.</li>'],
['ordini','Registro ordini','<li><b>Registro ordini</b> (scheda Bolle): salva gli ordini ai fornitori con data, reparto, tipo e kit ordinati.</li><li><b>Compreso nel canone</b> o <b>Fuori canone</b>: lo scegli a ogni ordine. In alto vedi quanti ordini fuori canone hai fatto negli ultimi 90 giorni per fornitore, utile per capire se il canone basta.</li><li><b>Da Avvisi</b>: nella lista di riordino, “Segna come ordinato” prepara l’ordine con i kit suggeriti, da controllare e salvare.</li><li><b>Alla consegna</b>: registrando una bolla scegli l’ordine collegato. L’app confronta i kit per codice o nome e aggiorna le quantità: Ordinato, Parziale o Completo.</li><li>Per ordini senza bolla usa “Arrivato tutto”; “Chiudi con differenze” chiude un ordine che non arriverà completo.</li><li>Un ordine aperto da troppo tempo compare in Avvisi (i giorni si scelgono nel registro).</li><li>I dati restano su questo telefono: un collega vede solo i propri ordini.</li>'],
['problemi','Problemi comuni','<li><b>La fotocamera non parte</b>: consentila in Impostazioni, Safari, Fotocamera. Se resta bloccata usa “Scatta foto”. Se la pagina è dentro un’altra app, aprila in Safari.</li><li><b>Codice non letto</b>: avvicinati, usa più luce, evita i riflessi, oppure compila a mano.</li><li><b>Nome sbagliato</b>: scegli un suggerimento, usa “Fotografa il nome” o scrivilo: la volta dopo l’app lo ricorda.</li><li><b>Dati che sembrano spariti</b>: l’app dalla Home e Safari hanno dati separati. Usa sempre la stessa e ripristina dal backup.</li><li><b>Versione</b>: la trovi in fondo alla pagina.</li>'],
['limiti','Limiti e privacy','<li>I dati stanno solo su questo telefono, non vengono condivisi.</li><li>Non inserire dati dei pazienti.</li><li>L’app non sostituisce procedure e registri del laboratorio: controlla sempre lotto e scadenza.</li><li>La ricerca online del nome invia soltanto il codice prodotto.</li>'],
['installa','Icona sulla Home','<li>In Safari tocca Condividi e poi <b>Aggiungi a Home</b>, e usa sempre quell’icona.</li><li>Per aggiornare l’app chiudila e riaprila.</li><li><b>Senza rete</b>: l’app si apre con l’ultima copia salvata, a patto che il file sw.js sia caricato accanto a index.html. Con la rete usa sempre la versione più recente.</li><li>Prima di rimuovere l’icona fai un backup: i dati sono dentro l’app.</li>']];

var OD=null,OMSG='',ODEL=null,OFIL='aperti';
function ords(){return S.ord=Array.isArray(S.ord)?S.ord:[]}
function onk(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function ordAperto(o){return!o.chiuso&&o.righe.some(function(r){return(+r.rec||0)<(+r.qty||0)})}
function ordStato(o){var miss=false,over=false;o.righe.forEach(function(r){var q=+r.qty||0,x=+r.rec||0;if(x<q)miss=true;if(x>q)over=true});if(o.chiuso)return{t:miss||over?'Chiuso con differenze':'Completo',c:miss||over?'bad':''};if(!miss)return{t:over?'Completo, con differenze':'Completo',c:over?'warn':''};return o.righe.some(function(r){return(+r.rec||0)>0})?{t:'Parziale',c:'warn'}:{t:'Ordinato',c:'info'}}
function ordN(){var n=ords().filter(ordAperto).length;return n?' ('+n+' aperti)':''}
function ordMatch(x,codes,nm){return!!((x.c&&codes.indexOf(nk(x.c))>-1)||(nm&&onk(x.n)===nm))}
function ordPend(it){var codes=[nk(it.ref),nk(it.gtin)].filter(Boolean),nm=onk(it.name);return ords().some(function(o){return ordAperto(o)&&o.righe.some(function(x){return(+x.rec||0)<(+x.qty||0)&&ordMatch(x,codes,nm)})})}
function ordApply(id,R,num){if(!id)return'';var o=ords().filter(function(x){return String(x.id)===String(id)})[0];if(!o)return'';var nf=0;R.forEach(function(r){var rr=r.g?cercaKit(r.g,true):null,codes=[nk(r.g),rr?nk(rr.codice):'',rr?nk(rr.codiceBarre):''].filter(Boolean),nm=onk(r.n),m=o.righe.filter(function(x){return ordMatch(x,codes,nm)})[0];if(m)m.rec=(+m.rec||0)+r.qty;else nf++});o.bolle=(o.bolle||[]).concat([num]);save();return' Ordine '+(o.num||fmt(o.d))+': '+ordStato(o).t+(nf?' ('+nf+' righe non presenti nell’ordine)':'')+'.'}
function ordSel(B){var L=ords().filter(ordAperto);if(!L.length)return'';L.sort(function(a,b){return a.d<b.d?1:-1});return'<label for="b_ord">Ordine collegato (facoltativo)</label><select id="b_ord"><option value="">Nessuno</option>'+L.map(function(o){return'<option value="'+o.id+'"'+(String(B.ord)===String(o.id)?' selected':'')+'>'+esc((o.forn||'?')+' · '+fmt(o.d)+(o.rep?' · '+o.rep:'')+' · '+ordStato(o).t)+'</option>'}).join('')+'</select>'}
function newO(){return{forn:'',date:isod(today()),num:'',rep:S.cur||'',tipo:S.ordTipo||'canone',note:'',righe:[{n:'',c:'',qty:1}]}}
function readO(){if(!OD)return;var g=function(i){var e=document.getElementById(i);return e?e.value:null},v;['forn','date','num','rep','tipo','note'].forEach(function(k){v=g('o_'+k);if(v!==null)OD[k]=v});OD.righe.forEach(function(r,i){var a=g('o_n'+i);if(a!==null){r.n=a;r.c=g('o_c'+i);r.qty=g('o_q'+i)}})}
function ordForm(){var O=OD,fl={};ords().forEach(function(o){if(o.forn)fl[o.forn]=1});(S.bolle||[]).forEach(function(b){if(b.forn)fl[b.forn]=1});return'<div class="prod"><b>Nuovo ordine</b><label for="o_forn">Fornitore</label><input type="text" id="o_forn" list="ofl" value="'+esc(O.forn)+'"><datalist id="ofl">'+Object.keys(fl).map(function(f){return'<option value="'+esc(f)+'">'}).join('')+'</datalist><datalist id="odn">'+DATABASE_KIT.map(function(k){return'<option value="'+esc(k.nome)+'">'}).join('')+'</datalist><div class="grid"><div><label for="o_date">Data</label><input type="date" id="o_date" value="'+esc(O.date)+'"></div><div><label for="o_num">N. ordine (facoltativo)</label><input type="text" id="o_num" value="'+esc(O.num)+'"></div></div><label for="o_rep">Reparto</label><select id="o_rep"><option value="">Scegli il reparto</option>'+SECT.map(function(s){return'<option'+(O.rep===s?' selected':'')+'>'+esc(s)+'</option>'}).join('')+'</select><label for="o_tipo">Tipo</label><select id="o_tipo"><option value="canone"'+(O.tipo==='canone'?' selected':'')+'>Compreso nel canone</option><option value="extra"'+(O.tipo==='extra'?' selected':'')+'>Fuori canone</option></select><h2>Kit ordinati ('+O.righe.length+')</h2>'+O.righe.map(function(r,i){return'<div class="row"><label for="o_n'+i+'" style="margin-top:0">Nome kit</label><input type="text" id="o_n'+i+'" list="odn" value="'+esc(r.n)+'"><div class="grid"><div><label for="o_c'+i+'">Codice (REF o GTIN)</label><input type="text" id="o_c'+i+'" value="'+esc(r.c)+'"></div><div><label for="o_q'+i+'">Quantità</label><input type="number" id="o_q'+i+'" min="1" value="'+esc(r.qty)+'"></div></div><button class="ed" data-a="orm" data-i="'+i+'" type="button">Togli riga</button></div>'}).join('')+'<button class="ed" data-a="oadd" type="button">Aggiungi riga</button><label for="o_note">Note (facoltative)</label><input type="text" id="o_note" value="'+esc(O.note)+'"><p id="ost" class="sub"></p><button class="cta" data-a="osave" type="button">Salva ordine</button><button class="ed" data-a="ocancel" type="button">Annulla</button></div>'}
function ordRow(o){var s=ordStato(o),ap=ordAperto(o);return'<details'+(ODEL===o.id?' open':'')+'><summary>'+esc(o.forn||'Senza fornitore')+' — '+fmt(o.d)+'<br><small>'+(o.tipo==='extra'?'Fuori canone':'Canone')+' · '+rdot(o.rep)+esc(o.rep||'')+' · '+s.t+'</small></summary>'+(o.num?'<small class="sub">N. ordine '+esc(o.num)+'</small>':'')+o.righe.map(function(r){var q=+r.qty||0,x=+r.rec||0;return'<div class="lot"><span>'+esc(r.n||r.c)+(r.c&&r.n?'<br><small>'+esc(r.c)+'</small>':'')+'</span><b'+(x<q?' class="x"':'')+'>'+x+'/'+q+'</b></div>'}).join('')+(o.bolle&&o.bolle.length?'<small class="sub">Bolle collegate: '+esc(o.bolle.join(', '))+'</small><br>':'')+(o.note?'<small class="sub">'+esc(o.note)+'</small><br>':'')+(ap?'<button class="ed" data-a="oall" data-id="'+o.id+'" type="button">Arrivato tutto</button> <button class="ed" data-a="oclose" data-id="'+o.id+'" type="button">Chiudi con differenze</button> ':'')+'<button class="ed bad" data-a="odel" data-id="'+o.id+'" type="button">'+(ODEL===o.id?'Conferma: elimina davvero':'Elimina ordine')+'</button></details>'}
function ordHtml(){var L=ords().slice().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.id-a.id}),h='<button class="ed" data-a="ordback" type="button" style="margin:0 0 12px">‹ Torna alle bolle</button>';if(OMSG){h+='<div class="row info"><b>'+esc(OMSG)+'</b></div>';OMSG=''}h+=OD?ordForm():'<button class="cta" data-a="onew" type="button" style="margin-top:0">Registra un ordine</button>';if(!OD){var ex={};L.forEach(function(o){if(o.tipo==='extra'&&days(o.d)>=-90){var q=o.righe.reduce(function(a,r){return a+(+r.qty||0)},0),k=o.forn||'?',e=ex[k]=ex[k]||{n:0,q:0};e.n++;e.q+=q}});var ks=Object.keys(ex);if(ks.length)h+='<h2>Fuori canone, ultimi 90 giorni</h2>'+ks.map(function(k){return'<div class="row warn"><b>'+esc(k)+'</b><small>'+ex[k].n+' ordini · '+ex[k].q+' pezzi</small></div>'}).join('');h+='<h2>Registro ordini</h2><label for="o_fil" style="margin-top:0">Mostra</label><select id="o_fil"><option value="aperti"'+(OFIL==='aperti'?' selected':'')+'>Solo ordini aperti</option><option value="tutti"'+(OFIL==='tutti'?' selected':'')+'>Tutti</option></select>';var V=L.filter(function(o){return(OFIL==='tutti'||ordAperto(o))&&(!S.cur||o.rep===S.cur)});h+=V.length?V.map(ordRow).join(''):'<p class="empty">Nessun ordine'+(OFIL==='aperti'?' aperto':'')+'.</p>';h+='<label for="o_days">Avvisa se un ordine resta aperto da (giorni)</label><input type="number" id="o_days" min="1" value="'+(S.ordDays||7)+'"><button class="ed" data-a="ocsv" type="button">Esporta ordini in CSV</button><p id="qst" class="sub"></p>'}return h}
function oAct(a,b){
if(a==='bord'){view='ordini';OD=null;render();return true}
if(a==='ordback'){view='bolle';OD=null;render();return true}
if(a==='onew'){OD=newO();render();return true}
if(a==='ocancel'){OD=null;render();return true}
if(a==='oadd'){readO();OD.righe.push({n:'',c:'',qty:1});render();return true}
if(a==='orm'){readO();OD.righe.splice(+b.dataset.i,1);if(!OD.righe.length)OD.righe.push({n:'',c:'',qty:1});render();return true}
if(a==='osave'){readO();var O=OD,st=document.getElementById('ost'),R=O.righe.filter(function(r){return(r.n||'').trim()||(r.c||'').trim()}).map(function(r){return{n:(r.n||'').trim(),c:(r.c||'').trim(),qty:Math.max(1,parseInt(r.qty,10)||1),rec:0}});
if(!(O.forn||'').trim()){st.textContent='Scrivi il fornitore.';return true}
if(!O.rep){st.textContent='Scegli il reparto.';return true}
if(!O.date){st.textContent='Scegli la data.';return true}
if(!R.length){st.textContent='Aggiungi almeno un kit.';return true}
ords().push({id:Date.now(),d:O.date,forn:O.forn.trim(),rep:O.rep,num:(O.num||'').trim(),tipo:O.tipo,note:(O.note||'').trim(),righe:R,bolle:[]});S.ordTipo=O.tipo;save();OD=null;OMSG='Ordine salvato ('+O.forn.trim()+').';render();return true}
if(a==='oall'||a==='oclose'||a==='odel'){var id=+b.dataset.id,o=ords().filter(function(x){return x.id===id})[0];if(!o)return true;
if(a==='oall'){o.righe.forEach(function(r){r.rec=Math.max(+r.rec||0,+r.qty||0)});save()}
else if(a==='oclose'){o.chiuso=true;save()}
else{if(ODEL!==id)ODEL=id;else{S.ord=ords().filter(function(x){return x.id!==id});ODEL=null;save()}}
render();return true}
if(a==='ocsv'){var r=[['Data','Fornitore','Reparto','Tipo','N. ordine','Kit','Codice','Ordinati','Arrivati','Stato']];ords().forEach(function(o){o.righe.forEach(function(x){r.push([fmt(o.d),o.forn,o.rep,o.tipo==='extra'?'Fuori canone':'Canone',o.num||'',x.n,x.c,x.qty,x.rec||0,ordStato(o).t])})});csvOut(r,'ordini-kit-'+isod(today())+'.csv');return true}
if(a==='rosegna'){var ks=roKeys().filter(function(k){return roQ(k)>0});if(!ks.length)return true;OD=newO();OD.forn=FO||'';var rp={};ks.forEach(function(k){rp[S.items[k].sec||'']=1});var rl=Object.keys(rp);if(!OD.rep&&rl.length===1)OD.rep=rl[0];OD.righe=ks.map(function(k){var it=S.items[k];return{n:it.name,c:it.ref||it.gtin||'',qty:roQ(k)}});view='ordini';render();return true}
return false}
document.getElementById('v').addEventListener('change',function(e){var i=e.target;if(i.id==='o_fil'){OFIL=i.value;render()}else if(i.id==='o_days'){S.ordDays=Math.max(1,parseInt(i.value,10)||7);save();render()}else if(/^o_n\d+$/.test(i.id)){var en=nomeKit(i.value);if(en){i.value=en.nome;var c=document.getElementById('o_c'+i.id.slice(3));if(c&&!c.value)c.value=en.codice||en.codiceBarre||''}}});
document.addEventListener('DOMContentLoaded',function(){try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
var vr=document.getElementById('ver'),V='Versione 08/11/2026 - x';
try{var c=localStorage.getItem(CKEY);if(c)buildCatalogo(JSON.parse(c))}catch(e){}
fetch('catalogo_kit.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(t){var j=parseCat(t);if(!j.length)throw new Error('file vuoto o illeggibile');buildCatalogo(j);try{localStorage.setItem(CKEY,JSON.stringify(j))}catch(e){}if(vr)vr.textContent=V+' · Catalogo: '+DATABASE_KIT.length+' kit';if(view==='nuovo'&&!LV){read();render()}}).catch(function(e){if(vr)vr.textContent=V+' · Catalogo NON aggiornato ('+(e&&e.message||e)+')'})});
render();
</script>
