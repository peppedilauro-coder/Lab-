<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magazzino kit</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kit Lab">
<meta name="theme-color" content="#0e6b5b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f0;--ink:#13231f;--mut:#5a6b66;--line:#cbd6d2;--surf:#fff;--acc:#0e6b5b;--onacc:#fff;--warn:#9a5b00;--warnbg:#fff1d6;--bad:#a8231b;--badbg:#fde4e1;--info:#1d4f91;--infobg:#e1ecfb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1816;--ink:#e6efec;--mut:#9bb0aa;--line:#2b3d38;--surf:#17231f;--acc:#4cc2ab;--onacc:#06201a;--warn:#f2c46b;--warnbg:#3a2c0e;--bad:#ff9d94;--badbg:#401a17;--info:#9cc3f5;--infobg:#142a47}}
:root[data-theme="dark"]{--bg:#0f1816;--ink:#e6efec;--mut:#9bb0aa;--line:#2b3d38;--surf:#17231f;--acc:#4cc2ab;--onacc:#06201a;--warn:#f2c46b;--warnbg:#3a2c0e;--bad:#ff9d94;--badbg:#401a17;--info:#9cc3f5;--infobg:#142a47}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Public Sans",system-ui,sans-serif;padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px));max-width:640px;margin-inline:auto}
h1{font-size:1.5rem;font-weight:800;margin:8px 0 2px}
h2{font-size:1.05rem;margin:22px 0 8px}
.sub{color:var(--mut);margin:0 0 12px;font-size:.9rem}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surf);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:10px 4px;border-radius:10px}
nav button[aria-current=true]{color:var(--acc);background:var(--bg)}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.row{background:var(--surf);border-left:6px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 8px}
.row.bad{border-color:var(--bad);background:var(--badbg)}.row.warn{border-color:var(--warn);background:var(--warnbg)}.row.info{border-color:var(--info);background:var(--infobg)}
.row b{display:block}.row small{color:var(--mut)}
.empty{color:var(--mut);padding:8px 0}
.prod{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px}
.prod header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tot{font-weight:800}.tot.low{color:var(--bad)}
.lot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:.95rem}
.lot span{flex:1}.lot .x{color:var(--bad);font-weight:600}
.lot button{width:40px;height:40px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font-size:1.2rem}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.9rem}
input[type=text],input[type=date],input[type=number]{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cta{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:var(--onacc);font:inherit;font-weight:800;margin-top:18px}
.scan{display:block;text-align:center;padding:18px;border:2px dashed var(--acc);border-radius:12px;color:var(--acc);font-weight:800;cursor:pointer;margin:0}
.scan{position:relative;overflow:hidden}
.scan input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:100px;cursor:pointer}
nav button{font-size:.8rem}
select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink);font:inherit}
.ed{padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font:inherit;margin-top:8px}.ed.bad{color:var(--bad);border-color:var(--bad)}.prod .cta{margin-top:12px}
.lot .first{color:var(--acc);font-weight:800}
#lw video{width:100%;border-radius:12px;margin-top:10px;background:#000}
#st{min-height:1.4em;margin:8px 0 0;font-size:.9rem;color:var(--mut)}
</style>
</head>
<body>
<h1 id="t">Magazzino kit</h1>
<p class="sub" id="s"></p>
<main id="v"></main>
<nav>
<button data-v="avvisi">Avvisi</button>
<button data-v="scorte">Scorte</button>
<button data-v="scarico">Scarico</button>
<button data-v="nuovo">Nuovo kit</button>
<button data-v="riepilogo">Riepilogo</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var KEY='magazzino-kit-v1',DAYS=60,S={items:{},log:[]},view='avvisi',F={};
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
S.hist=S.hist||[];S.log=S.log||[];S.items=S.items||{};
var SECT=['Batteriologia','Chimica clinica','Radioimmunologia','Ematologia','Coagulazione','Biologia molecolare'];
S.cur=S.cur||'';Object.keys(S.items).forEach(function(k){if(k.indexOf('|')<0){var q=S.items[k];q.sec=q.sec||'';S.items['|'+k]=q;delete S.items[k]}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return(n<10?'0':'')+n}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function days(iso){var p=iso.split('-');return Math.round((new Date(+p[0],p[1]-1,+p[2])-today())/864e5)}
function fmt(iso){var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function total(it){return it.lots.reduce(function(a,l){return a+l.qty},0)}
function d6(x){var y=2000+ +x.slice(0,2),m=+x.slice(2,4),d=+x.slice(4,6);if(!d)d=new Date(y,m,0).getDate();return y+'-'+pad(m)+'-'+pad(d)}
function gs1(t){var o={},s=t.replace(/^\]d2/,'');
if(s.indexOf('(')>-1){var re=/\((\d{2,4})\)([^(]*)/g,m;while((m=re.exec(s)))o[m[1]]=m[2].replace(/\x1d/g,'');return o}
var fx={'01':14,'02':14,'11':6,'13':6,'15':6,'17':6},i=0;
while(i<s.length){if(s[i]==='\x1d'){i++;continue}var ai=s.substr(i,2);i+=2;
if(fx[ai]){if(s.length-i<fx[ai])return{};o[ai]=s.substr(i,fx[ai]);i+=fx[ai]}else{var j=s.indexOf('\x1d',i);if(j<0)j=s.length;o[ai]=s.substring(i,j);i=j}}
return o}
function alerts(){var a=[];var nb=Object.keys(S.items).length;if(nb&&(!S.bk||-days(S.bk)>30))a.push({c:'info',o:4,t:'Fai un backup dei dati',d:'Ultimo backup: '+(S.bk?fmt(S.bk):'mai')+'. Dalla scheda Riepilogo puoi salvare un file.'});
Object.keys(S.items).forEach(function(k){var it=S.items[k];if(S.cur&&it.sec!==S.cur)return;var NM=it.name+(it.sec&&!S.cur?' ('+it.sec+')':'');
it.lots.forEach(function(l){var d=days(l.exp);
if(d<0)a.push({c:'bad',o:0,t:NM+' scaduto',d:'Lotto '+l.lot+' · '+l.qty+' pz · scaduto il '+fmt(l.exp)});
else if(d<=DAYS)a.push({c:'warn',o:1,t:NM+' in scadenza',d:'Lotto '+l.lot+' · '+l.qty+' pz · scade tra '+d+' giorni ('+fmt(l.exp)+')'})});
if(it.cal&&it.calPending)a.push({c:'warn',o:1,t:NM+': calibrazione da registrare',d:'Cambio al lotto '+it.calPending+'. Registrala dalla scheda Scorte.'});var E=est(k);if(E&&total(it)>0&&E.d<=14&&!(it.min>0&&total(it)<=it.min))a.push({c:'warn',o:2,t:NM+': scorta per circa '+E.d+' giorni',d:'Consumo medio circa '+E.m+' kit/mese'});if(it.min>0&&total(it)<=it.min)a.push({c:'bad',o:2,t:NM+': scorta in esaurimento',d:total(it)+' pz in magazzino, soglia minima '+it.min})});
S.log.forEach(function(g){var u=g.k==='uso';if(-days(g.date)<=(u?14:30)&&(!S.cur||(g.sec||'')===S.cur))a.push({c:u?'warn':'info',o:u?2:3,t:g.name+(g.sec&&!S.cur?' ('+g.sec+')':'')+(u?': cambio lotto in uso':': nuovo lotto in arrivo'),d:'Da '+g.from+' a '+g.to+' il '+fmt(g.date)})});
return a.sort(function(x,y){return x.o-y.o})}
function render(){stopLive();
var al=alerts(),b=document.querySelectorAll('nav button');
b.forEach(function(x){x.setAttribute('aria-current',x.dataset.v===view);if(x.dataset.v==='avvisi')x.textContent='Avvisi'+(al.length?' ('+al.length+')':'')});
var h='',v=document.getElementById('v');
document.getElementById('s').textContent=view==='avvisi'?'Scadenze, scorte basse e cambi lotto':view==='scorte'?'Quantità per prodotto e lotto':view==='scarico'?'Inquadra il kit che stai per usare':view==='riepilogo'?'Kit scaricati nel mese, pronti da stampare':'Fotografa l’etichetta o compila a mano';
if(view==='avvisi'){h=al.length?al.map(function(x){return'<div class="row '+x.c+'"><b>'+esc(x.t)+'</b><small>'+esc(x.d)+'</small></div>'}).join(''):'<p class="empty">Nessun avviso. Aggiungi il primo kit dalla scheda “Nuovo kit”.</p>'}
if(view==='scorte'){var ks=Object.keys(S.items).filter(function(k){return!S.cur||S.items[k].sec===S.cur}).sort(function(a,b){var x=S.items[a],y=S.items[b],p=(x.sec||'')+x.name,q=(y.sec||'')+y.name;return p<q?-1:p>q?1:0});h=ks.length?ks.map(function(k){if(EK===k)return editHtml(k);var it=S.items[k],t=total(it);
return'<div class="prod"><header><b>'+esc(it.name)+'</b><span class="tot'+(it.min>0&&t<=it.min?' low':'')+'">'+t+' pz</span></header><small class="sub">'+(it.sec?esc(it.sec)+' · ':'')+(it.gtin?'Codice '+esc(it.gtin)+' · ':'')+'soglia minima '+(it.min||0)+(it.used?' · lotto in uso '+esc(it.used):'')+'</small><input type="text" class="rf" data-k="'+esc(k)+'" placeholder="Codice articolo" aria-label="Codice articolo" value="'+esc(it.ref||'')+'" style="margin:6px 0">'+estHtml(k)+calHtml(k)+
it.lots.map(function(l,i){var d=days(l.exp);return'<div class="lot"><span>Lotto '+esc(l.lot)+'<br><small>scade '+fmt(l.exp)+(d<0?' <b class="x">scaduto</b>':'')+(firstLot(it)===i?' <b class="first">usa per primo</b>':'')+'</small></span><button data-k="'+esc(k)+'" data-i="'+i+'" data-q="-1" aria-label="Usa un kit">−</button><b>'+l.qty+'</b><button data-k="'+esc(k)+'" data-i="'+i+'" data-q="1" aria-label="Aggiungi un kit">+</button></div>'}).join('')+'<button class="ed" data-a="edit" data-k="'+esc(k)+'">Modifica prodotto e lotti</button></div>'}).join(''):'<p class="empty">Nessun kit registrato.</p>'}
if(view==='nuovo'){h=(LIVE_OK?'<button class="cta" id="lv" type="button" style="margin:0 0 10px">Scansione in diretta</button>':'')+'<label class="scan"><input type="file" accept="image/*" capture="environment" id="ph">Scatta foto (codice o testo)</label><p id="st"></p>'+
'<label for="sc">Settore</label><select id="sc"><option value="">Scegli il settore</option>'+SECT.map(function(s){return'<option'+((F.sc||S.cur)===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'+
'<label for="n">Nome del kit</label><input type="text" id="n" value="'+esc(F.n)+'">'+nameTools()+
'<label for="g">Codice prodotto (GTIN)</label><input type="text" id="g" inputmode="numeric" value="'+esc(F.g)+'">'+
'<label for="r">Codice articolo (come sulla confezione)</label><input type="text" id="r" value="'+esc(F.r)+'">'+
'<div class="grid"><div><label for="l">Lotto</label><input type="text" id="l" value="'+esc(F.l)+'"></div><div><label for="e">Scadenza</label><input type="date" id="e" value="'+esc(F.e)+'"></div>'+
'<div><label for="q">Quantità ricevuta</label><input type="number" id="q" min="1" value="'+esc(F.q||1)+'"></div><div><label for="m">Soglia minima</label><input type="number" id="m" min="0" value="'+esc(F.m||0)+'"></div></div>'+
'<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="cal"'+(F.cal?' checked':'')+' style="width:auto"> Richiede calibrazione al cambio lotto</label>'+
'<button class="cta" id="sv">Salva kit</button>'}
if(view==='riepilogo')h=repHtml()+bkHtml();
if(view==='scarico')h=(LIVE_OK?'<button class="cta" id="lv2" type="button" style="margin:0 0 10px">Scansiona il kit da usare</button>':'')+'<label class="scan"><input type="file" accept="image/*" capture="environment" id="ph2">Scatta foto del codice</label><div id="rs"></div><p id="st"></p>'+undoBtn();
if(view==='avvisi')h+=ro2Html();
if(view!=='nuovo')h=secBar()+h;
v.innerHTML=h;if(view==='nuovo')bind();if(view==='scarico'){var b2=document.getElementById('lv2');if(b2)b2.onclick=function(){startLive(use,'lv2')};document.getElementById('ph2').onchange=function(e){var f=e.target.files[0];e.target.value='';readPhoto(f,document.getElementById('st'),use)}};if(view==='riepilogo')bindRep()}
function attempts(){var L=[],cr=[[0,0,1,1],[0,0,.6,.6],[.4,0,.6,.6],[0,.4,.6,.6],[.4,.4,.6,.6]];cr.forEach(function(c){[1400,800].forEach(function(sz){[0,90,270,180].forEach(function(r){L.push([c,sz,r])})})});return L}
function dec(img,a){var c=a[0],sx=c[0]*img.naturalWidth,sy=c[1]*img.naturalHeight,sw=c[2]*img.naturalWidth,sh=c[3]*img.naturalHeight,sc=Math.min(1,a[1]/Math.max(sw,sh)),cw=Math.round(sw*sc),ch=Math.round(sh*sc),q=a[2]%180!==0,cv=document.createElement('canvas');
cv.width=q?ch:cw;cv.height=q?cw:ch;var x=cv.getContext('2d');x.translate(cv.width/2,cv.height/2);x.rotate(a[2]*Math.PI/180);x.drawImage(img,sx,sy,sw,sh,-cw/2,-ch/2,cw,ch);
var hs=new Map();hs.set(ZXing.DecodeHintType.TRY_HARDER,true);hs.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.DATA_MATRIX,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.CODE_39]);
var mr=new ZXing.MultiFormatReader();mr.setHints(hs);
try{var t=mr.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText();return t||null}catch(e){return null}}
async function scan(img){var L=attempts(),fb=null;for(var i=0;i<L.length;i++){var t=dec(img,L[i]);if(t){if(gs1(t)['01'])return t;fb=fb||t}if(fb&&i>=7)return fb;await new Promise(function(r){setTimeout(r,0)})}return fb}
var EK=null,DP=false,RO=false,BK=null;
function est(k){var it=S.items[k],h=(S.hist||[]).filter(function(x){return(x.k||('|'+x.gtin))===k&&days(x.d)>=-90});if(!it||h.length<3)return null;var f=Math.max(14,-days(h.reduce(function(a,x){return x.d<a?x.d:a},h[0].d))),r=h.length/f,t=total(it);return{m:Math.round(r*300)/10,d:t>0?Math.round(t/r):0}}
function dur(d){return d<=0?'esaurita':d>=60?Math.round(d/30)+' mesi':d+' giorni'}
function estHtml(k){var e=est(k);return e?'<small class="sub">Consumo circa '+e.m+' kit/mese · scorta per circa '+dur(e.d)+'</small>':''}
function editHtml(k){var it=S.items[k];return'<div class="prod"><b>Modifica prodotto</b><label for="en">Nome</label><input type="text" id="en" value="'+esc(it.name)+'"><label for="em">Soglia minima</label><input type="number" id="em" min="0" value="'+(it.min||0)+'"><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="ecal"'+(it.cal?' checked':'')+' style="width:auto"> Richiede calibrazione al cambio lotto</label>'+it.lots.map(function(l,i){return'<div class="grid"><div><label>Lotto</label><input type="text" id="el'+i+'" value="'+esc(l.lot)+'"></div><div><label>Scadenza</label><input type="date" id="ee'+i+'" value="'+esc(l.exp)+'"></div><div><label>Quantità</label><input type="number" id="eq'+i+'" min="0" value="'+l.qty+'"></div><div><label>&nbsp;</label><button class="ed" data-a="edl" data-i="'+i+'" style="margin:0">Elimina lotto</button></div></div>'}).join('')+'<button class="cta" data-a="esv" type="button">Salva modifiche</button><button class="ed" data-a="eca" type="button">Annulla</button> <button class="ed bad" data-a="edp" type="button">'+(DP?'Conferma: elimina davvero':'Elimina prodotto')+'</button></div>'}
function applyEdit(it){var n=document.getElementById('en').value.trim();if(n)it.name=n;it.min=parseInt(document.getElementById('em').value,10)||0;it.cal=document.getElementById('ecal').checked;if(!it.cal)it.calPending=undefined;it.lots.forEach(function(l,i){var lt=document.getElementById('el'+i),ex=document.getElementById('ee'+i),q=document.getElementById('eq'+i);if(!lt)return;if(lt.value.trim())l.lot=lt.value.trim();if(ex.value)l.exp=ex.value;var v=parseInt(q.value,10);if(v>=0)l.qty=v})}
function undoLast(){var x=S.hist[S.hist.length-1];if(!x)return null;var it=S.items[x.k||('|'+x.gtin)];if(it){var l=it.lots.filter(function(z){return z.lot===x.lot})[0];if(l)l.qty+=1;else it.lots.push({lot:x.lot,exp:x.exp,qty:1});it.lots.sort(function(p,q){return p.exp<q.exp?-1:1});if(x.pu!==undefined)it.used=x.pu;if(x.pc!==undefined)it.calPending=x.pc||undefined}if(x.lg&&S.log.length)S.log.pop();S.hist.pop();save();return x}
function undoBtn(){var x=S.hist[S.hist.length-1];return x?'<button class="ed" data-a="undo" type="button">Annulla ultimo scarico: '+esc(x.name)+', lotto '+esc(x.lot)+'</button>':''}
function roItems(){return Object.keys(S.items).filter(function(k){var it=S.items[k],e=est(k);return(!S.cur||it.sec===S.cur)&&((it.min>0&&total(it)<=it.min)||(e&&total(it)>0&&e.d<=14))}).map(function(k){var it=S.items[k];return{n:it.name,s:it.sec,r:it.ref||'',g:it.gtin||'',t:total(it),m:it.min,e:est(k)}})}
